<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/styles.css">
  <script src="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: #FFFFFF; }
    a { color: #275EBF; } a:hover { color: #1D4A9C; }
  </style>
</helmet>
<div data-screen-label="Sectors" style="font: var(--style-body); color: var(--text-body)">
  <dc-import name="SiteNav" active="Sectors" hint-size="100%,68px" style="position: sticky; top: 0; z-index: 40"></dc-import>

  <section style="background: var(--surface-dark); color: var(--text-inverse); padding: 88px 0 72px">
    <div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: flex; flex-direction: column; gap: 20px">
      <span style="font: var(--style-eyebrow); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--accent-on-dark)">Where we work</span>
      <h1 style="margin: 0; font: var(--style-h1); letter-spacing: var(--tracking-tight); color: var(--white)">Sectors</h1>
      <p style="margin: 0; font: var(--style-body-lg); color: rgba(255,255,255,0.72); max-width: 620px">Deep, current experience across the regulated financial landscape, capital markets, banking, insurance, wealth and the fintech community.</p>
    </div>
  </section>

  <section style="padding: var(--section-pad) 0; background: var(--surface-page)">
    <div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px">
      <sc-for list="{{ sectors }}" as="s" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 28px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm)">
          <span style="font: var(--weight-medium) var(--text-sm)/1 var(--font-mono); color: var(--accent)">{{ s.num }}</span>
          <strong style="font: var(--weight-semibold) var(--text-lg)/1.3 var(--font-display); color: var(--text-heading)">{{ s.title }}</strong>
          <span style="font: var(--style-caption); color: var(--text-muted)">{{ s.body }}</span>
          <a href="Contact.dc.html" style="font: var(--weight-medium) var(--text-sm)/1 var(--font-body); color: var(--accent); text-decoration: none; margin-top: auto">Talk to us →</a>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Asset & wealth management', 'Distribution, order management, reporting and cost transparency across mandates.'],
      ['Banks', 'Lending, payments and regulatory reporting modernisation under supervisory pressure.'],
      ['Financial markets', 'Capital markets transformation, regulatory change and entity restructuring.'],
      ['Fintechs', 'Scale-up operating models, case management and customer lifecycle processes.'],
      ['Growth companies', 'Data, technology and operating model strategy for fast-growing firms.'],
      ['Insurers', 'Finance re-engineering, claims transformation and technology strategy.'],
    ];
    return {
      sectors: data.map(([title, body], i) => ({
        num: '0' + (i + 1),
        title,
        body,
        borderTop: i === 0 ? 'none' : '1px solid var(--border-default)',
      })),
    };
  }
}
</script>
</body>
</html>
