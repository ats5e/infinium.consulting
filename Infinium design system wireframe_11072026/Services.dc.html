<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/styles.css">
  <script src="_ds/infinium-design-system-292503cd-5a5e-4870-8e83-d04850aa429f/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: #FFFFFF; }
    a { color: #275EBF; } a:hover { color: #1D4A9C; }
  </style>
</helmet>
<div data-screen-label="Services" style="font: var(--style-body); color: var(--text-body)">
  <dc-import name="SiteNav" active="Services" hint-size="100%,68px" style="position: sticky; top: 0; z-index: 40"></dc-import>

  <section style="background: var(--surface-dark); color: var(--text-inverse); padding: 88px 0 72px">
    <div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: flex; flex-direction: column; gap: 20px">
      <span style="font: var(--style-eyebrow); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--accent-on-dark)">What we do</span>
      <h1 style="margin: 0; font: var(--style-h1); letter-spacing: var(--tracking-tight); color: var(--white)">Our services</h1>
      <p style="margin: 0; font: var(--style-body-lg); color: rgba(255,255,255,0.72); max-width: 620px">Market-leading strategy, specialist transformation and AI-enabled automation solutions for regulated financial services.</p>
    </div>
  </section>

  <section style="padding: var(--section-pad) 0; background: var(--surface-page)">
    <div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px">
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
        <a href="{{ s.href }}" style="text-decoration: none; display: block">
          <x-import component-from-global-scope="InfiniumDesignSystem_292503.Card" hoverable="{{ true }}" eyebrow="{{ s.eyebrow }}" title="{{ s.title }}" hint-size="100%,220px">
            <span style="display: flex; flex-direction: column; gap: 10px; font-size: var(--text-sm); line-height: var(--leading-normal)">{{ s.body }}<span style="font: var(--weight-medium) var(--text-sm)/1 var(--font-body); color: var(--accent)">Learn more →</span></span>
          </x-import>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="background: var(--surface-inset); padding: 72px 0">
    <div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: flex; justify-content: space-between; align-items: center; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font: var(--style-h3); letter-spacing: var(--tracking-tight); color: var(--text-heading)">Not sure where to start?</h2>
        <p style="margin: 0; font: var(--style-body); color: var(--text-muted)">We shape strategy and solution options around your goals and challenges.</p>
      </div>
      <a href="Contact.dc.html" style="text-decoration: none; flex-shrink: 0"><x-import component-from-global-scope="InfiniumDesignSystem_292503.Button" size="lg" hint-size="190px,48px">Schedule a discussion</x-import></a>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,340px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      services: [
        { eyebrow: 'Intelligence', title: 'Data & AI', href: 'Data and AI.dc.html', body: 'Sourcing, governing and leveraging enterprise data, and taking AI from pilots to production, responsibly.' },
        { eyebrow: 'Automation', title: 'Digital & automation', href: 'Digital and Automation.dc.html', body: 'AI-enabled process automation that takes key processes from weeks to minutes.' },
        { eyebrow: 'Risk & control', title: 'Regulation & compliance', href: 'Regulation and Compliance.dc.html', body: 'Meeting new regulation, managing risk and enhancing controls across the enterprise.' },
        { eyebrow: 'Advisory', title: 'Strategy and Change', href: 'Strategy and Change.dc.html', body: 'Business, technology and data strategy shaped up front to pave the way for successful execution.' },
        { eyebrow: 'Risk & control', title: 'Sustainable finance', href: 'Sustainable Finance.dc.html', body: 'ESG reporting and climate-aligned finance solutions, delivered at programme pace.' },
        { eyebrow: 'Delivery', title: 'Transformation', href: 'Transformation.dc.html', body: 'Programme leadership for complex change, from operating models to entity stand-ups.' },
      ],
    };
  }
}
</script>
</body>
</html>
