# force patched transitives that next pins internally (postcss/nanoid advisories).
# sharp is a pinned direct dependency (see package.json) — an override on a direct
# dep makes `pnpm install --frozen-lockfile` fail with a specifier mismatch in CI.
overrides:
  postcss: '>=8.5.18'
  nanoid: '^3.3.18'
allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
